name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Binary
        run: npm run build

      - name: Verify Build Output
        run: |
          test -f production/server || { echo "❌ Build failed: production/server not found"; exit 1; }
          echo "✅ Binary size: $(du -h production/server | cut -f1)"

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT }}
          source: "production/server,production/node_modules"
          target: "/tmp/bm_deploy"
          overwrite: true
          strip_components: 1

      - name: Replace, Restart & Verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR }}"
            PM2_NAME="bm_backend"
            STAGING="/tmp/bm_deploy"

            cd "$DEPLOY_DIR"

            # ── Backup current binary ──
            if [ -f server ]; then
              cp server server.bak
              echo "✅ Backed up server → server.bak"
            fi

            # ── Atomic replacement ──
            mv "$STAGING/server" server
            chmod +x server

            # ── Update node_modules only if they were uploaded ──
            if [ -d "$STAGING/node_modules" ]; then
              rm -rf node_modules
              mv "$STAGING/node_modules" node_modules
              echo "✅ Updated node_modules"
            fi

            # ── Clean staging ──
            rm -rf "$STAGING"

            # ── Restart PM2 ──
            pm2 restart "$PM2_NAME" || pm2 start ./server --name "$PM2_NAME"
            pm2 save

            # ── Health check (wait 5s, then verify process is online) ──
            sleep 5
            STATUS=$(pm2 jlist | python3 -c "
            import sys, json
            procs = json.load(sys.stdin)
            for p in procs:
              if p['name'] == '$PM2_NAME':
                print(p['pm2_env']['status'])
                sys.exit(0)
            print('not_found')
            ")

            if [ "$STATUS" = "online" ]; then
              echo "✅ Health check passed — $PM2_NAME is online"
            else
              echo "❌ Health check FAILED — status: $STATUS"
              echo "🔄 Rolling back to server.bak..."
              if [ -f server.bak ]; then
                mv server.bak server
                chmod +x server
                pm2 restart "$PM2_NAME"
                sleep 3
                echo "⚠️  Rolled back to previous version"
              fi
              exit 1
            fi

            # ── Clean up backup on success ──
            rm -f server.bak
            echo "🚀 Deployment complete"

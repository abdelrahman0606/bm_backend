name: Build Production SEA (Linux x64)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Linux Executable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build SEA Executable
        run: npm run build
        
      - name: Zip Production Directory
        run: |
          cd production
          zip -r ../production-linux-x64.zip .
          cd ..

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-linux-x64
          path: production-linux-x64.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: production-linux-x64.zip
          generate_release_notes: true
